message: "[url=https://ai-candy.app/]Candy AI[/url] offers AI-powered companions for romantic conversations, virtual relationships and character-led roleplay. You can select an existing character or build a personalised character. The operator is EverAI Limited, incorporated in Malta under number C107181. The service is intended for adults aged 18 or over who meet the applicable age-of-majority requirements. \r\n \r\nWhat You Can Test Without a Paid Plan \r\n \r\nThe documented free-user guide lists up to five chat messages, shared across all characters; one custom AI character; and one generated image. Confirm the current allowance in your account. \r\n \r\nPlan your first messages: begin with a brief opening scene, then follow up with a clear preference about reply length. Check whether the next reply reflects your instruction. That provides a practical way to assess the writing style before choosing a subscription. \r\n \r\nCustomise a Virtual Character \r\n \r\nChoose Create Character and pick the Realistic style or the Anime option. The homepage lists customisation options for hairstyle, hair colour, eye colour, voice, personality and hobbies. \r\n \r\nStart with a clear personality idea, then add a preferred communication style. As a starting point: “Personality: thoughtful. Interests: music. Replies: short, with one follow-up question.” \r\n \r\nSpecific preferences give you something concrete to evaluate. The help centre describes personality instructions, your own messaging style and regenerating a reply as ways to adjust the tone. Change one instruction at a time to compare the effect. \r\n \r\nExplore Alternative Conversation Paths \r\n \r\nClone Chat duplicates your current conversation, including the history up to that point. You can continue the copy in a different direction while keeping the original thread. \r\n \r\nFor a storytelling experiment, keep one branch as a quiet conversation and steer the other towards an adventure. Review how the character reacts to the changed premise. \r\n \r\nThe memory guide describes Reset Chat as starting the interaction afresh, while Delete Chat deletes the chat thread. According to this guide, there is no option to clear the history while fully retaining long-term conversation memory. \r\n \r\nExplore the Visual and Voice Features \r\n \r\nGenerate Image organises available characters into Girls, Anime and Guys. Choose a character to start your image request. \r\n \r\nThe feature documentation lists creating images, listening to voice messages, voice calls in beta and video generation among the features that use tokens. It also explains turning a suitable chat-generated image into a video clip. Review the required token balance for the operation you want before committing your remaining tokens. \r\n \r\nBuild Your Video offers preset selections for character, action, location and another participant. Select your preferred presets, then click Generate video. The resulting clip appears in My Generations. The generated result may differ from the presets. \r\n \r\nCandy Shorts provides pre-written video stories featuring virtual companions. Episodes usually run for under two minutes and remain separate from your conversation history. Watching them does not change your relationship with a character or chat history. \r\n \r\nSubscription Costs: Check the Full Payment \r\n \r\nThe published subscription offer, checked on 13 November 2026, listed: \r\n \r\nOne-month subscription: $9.99 for the first month, then $13.99 monthly. \r\n \r\nQuarterly plan: $26.97 paid upfront, working out at $8.99 per month. \r\n \r\nAnnual plan: $47.88 billed at once, working out at $3.99 per month. \r\n \r\nCheck the total charged upfront alongside the monthly equivalent. Automatic renewal applies; additional local taxes may be charged. Confirm the checkout total before paying. \r\n \r\nPlan Your Token Budget \r\n \r\nThe Premium documentation lists unlimited text chatting and 100 tokens each month. The token refresh follows the date you first subscribed. Users on an annual plan also receive 100 tokens monthly. \r\n \r\nRegular text chatting does not use up tokens, according to the support guide. Once you run out of tokens, text chatting remains available with an active subscription; extra credits are needed for the features requiring a balance. \r\n \r\nSet a fixed spending limit for top-ups. When considering another media request, decide whether a more specific description would help you assess the feature. Check the applicable token cost for each action. \r\n \r\nCancel Your Subscription \r\n \r\nThe documented account route points to My Profile > Settings > Unsubscribe. Complete the confirmation steps to confirm unsubscribing. \r\n \r\nAccording to the help centre, cancellation prevents subsequent automatic renewals, and Premium remains active until the end of the existing billing period. A request to return a previous payment is handled separately and requires review. \r\n \r\nThe content-retention guide says cancelling Premium keeps your chats, images, characters and history while the account remains active. Unused tokens stay on the account, but their balance is hidden on Free and using them again requires a Premium subscription. \r\n \r\nData Use and the Nature of AI Characters \r\n \r\nThe privacy policy describes user prompts, character responses and companion settings. The document states that technical providers, including language-model providers, may receive message content. It also permits processing anonymised or de-identified conversations for model training and technology improvement. \r\n \r\nChoose fictional details for story experiments, and leave passwords and financial information out of your prompts. These precautions reflect the advice about sensitive information in the service’s terms. \r\n \r\nThe Terms describe Candy AI as an entertainment service. Its characters generate fictional interactions and do not possess genuine emotions. For a useful first session, assess one character, one clear conversational preference and a chosen visual or voice feature, then weigh the results in light of the total subscription cost and your planned spending on extra credits."
